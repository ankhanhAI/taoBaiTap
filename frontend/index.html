<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Q-GEN AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1 class="title">
    Q-GEN AI<br>
    <span>Người bạn ôn tập số</span>
  </h1>

  <p class="desc">
    Tạo bài tập trắc nghiệm tự động bằng AI
  </p>

  <!-- FORM -->
  <div class="form">
    <label>Nội dung bài học</label>
    <textarea id="content" placeholder="Ví dụ: Hàm số bậc hai y = ax² + bx + c"></textarea>

    <label>Độ khó</label>
    <select id="difficulty">
      <option value="dễ">Dễ</option>
      <option value="trung bình" selected>Trung bình</option>
      <option value="khó">Khó</option>
    </select>

    <label>Số câu hỏi</label>
    <input type="number" id="count" value="5" min="1" max="20">

    <button onclick="generate()">🚀 Tạo câu hỏi</button>
  </div>

  <!-- KẾT QUẢ -->
  <div id="result" class="result">
    <!-- AI trả kết quả ở đây -->
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
