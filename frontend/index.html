<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Q-GEN AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Q-GEN AI</h1>
  <p class="sub">Người bạn ôn tập số</p>

  <button class="create-btn" onclick="openModal()">+ Tạo Bài Tập Mới</button>
  <p class="hint">Nhấn để AI tạo câu hỏi</p>

  <div id="result"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>Tạo bài tập</h2>

    <input id="title" placeholder="Tiêu đề bài tập">
    <textarea id="content" placeholder="Nội dung bài học"></textarea>

    <select id="difficulty">
      <option>Dễ</option>
      <option>Trung bình</option>
      <option>Khó</option>
    </select>

    <input type="number" id="count" value="5">

    <div class="actions">
      <button onclick="closeModal()">Hủy</button>
      <button onclick="generate()">Tạo</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
