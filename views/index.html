<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnKhanh-AI</title>
  <link rel="stylesheet" href="/style-index.css">
</head>
<body>

  <div class="home" id="home">
    <h1>AnKhanh-AI</h1>
    <p>Người bạn ôn tập số của học sinh</p>
    <p>GV thực hiện: Võ Thị Anh Phương</p>
     <p>             Nguyễn Thị Ngọc Điệp</p>
    <button class="btn-main" onclick="openForm()">+ Tạo Bài Tập Mới</button>
  </div>

  <div class="overlay" id="form" style="display:none;">
    <div class="wrapper">
      <h2>Thiết Lập Bài Tập</h2>
      
      <label for="title">Tên bài tập</label>
      <input type="text" id="title" placeholder="Ví dụ: Vật lí 10">
      
      <label for="content">Nội dung kiến thức</label>
      <textarea id="content" placeholder="Dán nội dung bài học hoặc chủ đề vào đây..."></textarea>

      <div class="card">
        <strong>Trắc nghiệm chọn một đáp án</strong>
        <div class="counter">
          <button onclick="change('single', -1)">−</button>
          <input id="single" type="number" value="5">
          <button onclick="change('single', 1)">+</button>
        </div>
      </div>

      <div class="card">
        <strong>Đúng / Sai</strong>
        <div class="counter">
          <button onclick="change('tf', -1)">−</button>
          <input id="tf" type="number" value="2">
          <button onclick="change('tf', 1)">+</button>
        </div>
      </div>

      <div class="card">
        <strong>Tự luận/Trả lời ngắn</strong>
        <div class="counter">
          <button onclick="change('multi', -1)">−</button>
          <input id="multi" type="number" value="3">
          <button onclick="change('multi', 1)">+</button>
        </div>
      </div>

      <label for="level">Độ khó</label>
      <select id="level">
        <option>Dễ</option>
        <option selected>Trung bình</option>
        <option>Khó</option>
      </select>

      <button id="submitBtn" class="submit" onclick="submitForm()">
        🚀 Tạo bài tập bằng AI
      </button>
      <button class="close" onclick="closeForm()">✖ Đóng</button>
    </div>
  </div>

  <script src="/script-index.js"></script>
</body>
</html>
