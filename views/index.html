<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Q-GEN AI</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>

  <!-- TRANG CHÍNH -->
  <div class="home" id="home">
    <h1>Q-GEN AI</h1>
    <p>Người bạn ôn tập số của học sinh THPT</p>
    <button onclick="openForm()">+ Tạo Bài Tập Mới</button>
  </div>

  <!-- FORM -->
  <div class="overlay" id="form">
    <div class="wrapper">
      <h2>Tạo Bài Tập Mới</h2>

      <label>Tên bài tập *</label>
      <input type="text" id="title" placeholder="Ví dụ: Ôn tập Toán 12">

      <label>Nội dung bài học *</label>
      <textarea id="content" placeholder="Ví dụ: Hàm số mũ - logarit"></textarea>

      <h3>Loại câu hỏi</h3>

      <!-- TRẮC NGHIỆM 1 -->
      <div class="card">
        <div>
          <strong>Trắc nghiệm 1 lựa chọn</strong>
          <p>Chọn 1 đáp án đúng</p>
        </div>
        <div class="counter">
          <button onclick="change('single', -1)">−</button>
          <input id="single" type="number" value="5" min="0">
          <button onclick="change('single', 1)">+</button>
        </div>
      </div>

      <!-- ĐÚNG / SAI -->
      <div class="card">
        <div>
          <strong>Đúng / Sai</strong>
          <p>Câu hỏi đúng hoặc sai</p>
        </div>
        <div class="counter">
          <button onclick="change('tf', -1)">−</button>
          <input id="tf" type="number" value="3" min="0">
          <button onclick="change('tf', 1)">+</button>
        </div>
      </div>

      <!-- NHIỀU LỰA CHỌN -->
      <div class="card">
        <div>
          <strong>Nhiều lựa chọn</strong>
          <p>Chọn nhiều đáp án đúng</p>
        </div>
        <div class="counter">
          <button onclick="change('multi', -1)">−</button>
          <input id="multi" type="number" value="2" min="0">
          <button onclick="change('multi', 1)">+</button>
        </div>
      </div>

      <label>Độ khó</label>
      <select id="level">
        <option>Dễ</option>
        <option>Trung bình</option>
        <option>Khó</option>
      </select>

      <button class="submit" onclick="submitForm()">
        🚀 Tạo bài tập bằng AI
      </button>

      <button class="close" onclick="closeForm()">✖ Đóng</button>
    </div>
  </div>

  <script src="/public/script.js"></script>
</body>
</html>
